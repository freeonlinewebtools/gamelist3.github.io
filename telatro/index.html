<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1"
    />
    <title>Telatro — Idle</title>

    <!-- Load custom style sheet -->
    <link rel="stylesheet" type="text/css" href="theme/love.css" />

    <link rel="icon" type="image/png" href="theme_root/icon.png" />
    <!-- icon from the main site -->
  </head>
  <body>
    <div id="fullscreenDiv">
      <div id="splash"></div>
      <button onclick="load();" id="loaderbutton">click to allow audio</button>
      <div id="header1">
        <!-- <button onclick="load();">Start game</button> -->
      </div>
      <canvas
        id="loadingCanvas"
        oncontextmenu="event.preventDefault()"
        width="800"
        height="600"
        display="none"
      ></canvas>
      <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        display="none"
      ></canvas>
    </div>

    <script type="text/javascript">
      // Apply scale(0.9) + centering directly to the canvas after Emscripten finishes
      // its resize. Emscripten removes CSS width/height but not transform/margin, so
      // these styles survive. Canvas pixel dims stay full-viewport so LÖVE renders correctly;
      // getBoundingClientRect compensates the scale factor for mouse coordinates automatically.
      function _applyCenterScale() {
        var canvas = document.getElementById('canvas');
        if (!canvas || !canvas.width || !canvas.height) return;
        canvas.style.position = 'absolute';
        canvas.style.top = '50%';
        canvas.style.left = '50%';
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
        canvas.style.marginTop = -(canvas.height / 2) + 'px';
        canvas.style.marginLeft = -(canvas.width / 2) + 'px';
        canvas.style.transform = 'scale(0.9)';
        canvas.style.transformOrigin = 'center center';
      }

      // Fake fullscreen so Emscripten's resize callback fires (which sets the canvas
      // to window.innerWidth x window.innerHeight) without ever entering native fullscreen.
      var _fakeFullscreenEl = null;

      function _fakeEnterFullscreen(el) {
        _fakeFullscreenEl = el;
        ['fullscreenElement','mozFullScreenElement','webkitFullscreenElement',
         'msFullscreenElement','webkitCurrentFullScreenElement'].forEach(function(p) {
          Object.defineProperty(document, p, { get: function(){ return _fakeFullscreenEl; }, configurable: true });
        });
        setTimeout(function() {
          document.dispatchEvent(new Event('fullscreenchange'));
          document.dispatchEvent(new Event('webkitfullscreenchange'));
          document.dispatchEvent(new Event('mozfullscreenchange'));
          // Emscripten's fullscreenchange handler runs synchronously in this tick;
          // apply centering after it has set canvas dimensions.
          setTimeout(_applyCenterScale, 0);
        }, 0);
        return Promise.resolve();
      }

      function _fakeExitFullscreen() {
        _fakeFullscreenEl = null;
        setTimeout(function() {
          document.dispatchEvent(new Event('fullscreenchange'));
        }, 0);
        return Promise.resolve();
      }

      Element.prototype.requestFullscreen = function() { return _fakeEnterFullscreen(this); };
      Element.prototype.webkitRequestFullscreen = function() { return _fakeEnterFullscreen(this); };
      Element.prototype.mozRequestFullScreen = function() { return _fakeEnterFullscreen(this); };
      Element.prototype.msRequestFullscreen = function() { return _fakeEnterFullscreen(this); };
      document.exitFullscreen = _fakeExitFullscreen;
    </script>
    <script type="text/javascript">
      function resizeCanvas() {
        // Emscripten owns canvas pixel dimensions; just re-center after a tick.
        setTimeout(_applyCenterScale, 0);
      }
      function goFullScreen() {
        var canvas = document.getElementById("canvas");
        canvas.style.display = "block";
        resizeCanvas();
      }
      function FullScreenHook() {
        resizeCanvas();
      }
      window.addEventListener("resize", function() { setTimeout(_applyCenterScale, 100); });
      document.addEventListener("fullscreenchange", function () {
        setTimeout(_applyCenterScale, 0);
      });
      var loadingContext = document
        .getElementById("loadingCanvas")
        .getContext("2d");
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;

        loadingContext.fillStyle = "rgb(142, 195, 227)";
        loadingContext.fillRect(0, 0, canvas.scrollWidth, canvas.scrollHeight);

        loadingContext.font = "2em arial";
        loadingContext.textAlign = "center";
        loadingContext.fillStyle = "rgb( 11, 86, 117 )";
        loadingContext.fillText(
          text,
          canvas.scrollWidth / 2,
          canvas.scrollHeight / 2
        );

        loadingContext.fillText(
          "Powered By Emscripten.",
          canvas.scrollWidth / 2,
          canvas.scrollHeight / 4
        );
        loadingContext.fillText(
          "Powered By LÖVE.",
          canvas.scrollWidth / 2,
          (canvas.scrollHeight / 4) * 3
        );
      }

      window.addEventListener(
        "keydown",
        function (e) {
          // space and arrow keys
          if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
            e.preventDefault();
          }
        },
        false
      );

      let statusText = ["Telatro is loading..."];

      var Module = {
        arguments: ["./"],
        INITIAL_MEMORY: 1149289489,
        printErr: console.error.bind(console),
        canvas: (function () {
          var canvas = document.getElementById("canvas");

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener(
            "webglcontextlost",
            function (e) {
              alert("WebGL context lost. You will need to reload the page.");
              e.preventDefault();
            },
            false
          );

          return canvas;
        })(),

        setStatus: function (text) {
          if (text) {
            const max = 30;
            // console.log(text);
            statusText.push(text);
            if (statusText.length >= max) {
              statusText = statusText.slice(statusText.length - max);
            }
            document.getElementById("header1").innerHTML =
              "<p>" + statusText.join("</p><p>") + "</p>";
          } else if (Module.remainingDependencies === 0) {
            document.getElementById("loadingCanvas").style.display = "none";
            document.getElementById("canvas").style.visibility = "visible";
            document.getElementById("header1").remove();
            // Canvas is now visible and Emscripten has set its dimensions — apply centering.
            _applyCenterScale();
          }
          console.log(text);
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  " " +
                  parseInt(
                    ((this.totalDependencies - left) / this.totalDependencies) *
                      100
                  ) +
                  "%)"
              : "All downloads complete."
          );
        },
      };
      // Module.setStatus("Downloading...");
      window.onerror = function (event) {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus("Exception thrown, see JavaScript console");
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };

      var applicationLoad = function (e) {
        Love(Module);
      };

      function load() {
        applicationLoad(document.getElementById("data"));
        // document.getElementById("header0").remove();
        document.getElementById("loaderbutton").remove();
        // document.getElementById("splash").remove();
      }

      setTimeout(() => {
        document.getElementById("splash").style.opacity = 0;
        setTimeout(() => {
          document.getElementById("splash").remove();
        }, 1000);
      }, 1000);

      // Trigger love.js's FS.syncfs by dispatching a synthetic beforeunload.
      // love.js registers window.addEventListener("beforeunload", ...) which calls FS.syncfs(false).
      function _triggerSave() {
        window.dispatchEvent(new Event("beforeunload"));
      }
      // Save when tab is hidden or page is unloaded (covers iframe hide + mobile)
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") _triggerSave();
      });
      window.addEventListener("pagehide", _triggerSave);
      // Periodic autosave every 60 seconds
      setInterval(_triggerSave, 60000);
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" id="data"></script>
